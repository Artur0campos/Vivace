<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="loginStyle.css">
    <title>Inscrição</title>
</head>

<body>
    <header class="header">
        <img src="img/violao.png" alt="Violão" class="icon-left">
        <div class="title">
            <h1><span class="orange">Vi</span><span class="green">va</span><span class="gray">ce</span></h1>
            <h2>Escola de Música</h2>
        </div>
        <img src="img/logo.png" alt="Logo Vivace" class="logo">
    </header>

    <nav class="navbar">
        <a href="#quem-somos">Quem somos</a>
        <a href="#aulas">Aulas</a>
        <a href="#planos">Planos</a>
        <a href="#contato">Contato</a>
        <a href="#instagram">Instagram</a>
    </nav>

    <div id="main_section">
        <div id="inscricao">
            <h2>Login</h2>
            <input id="input-name" type="text" placeholder="Nome Completo"><br>
            <input id="input-email" type="text" placeholder="Email válido"><br>
            <input id="input-tipoAula" type="text" placeholder="Aula Desejada"><br>
            <button id="inscricao-btn">Inscrever</button>
        </div>

        <div id="mapa">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3898.8633562216273!2d-38.94045692015863!3d-12.257524957044712!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x7143777ed52bbeb%3A0x280458b2a365f064!2sVivace%20Escola%20de%20M%C3%BAsica!5e0!3m2!1spt-BR!2sbr!4v1762795019867!5m2!1spt-BR!2sbr"
                width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
    </div>

    <div class="missao">
        <div class="container">
            <p>
                Nossa missão é mostrar que a música é para todos e tem o poder de transformar vidas,
                ajudando cada um a descobrir a sua própria melodia.
            </p>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div id="contato" class="item">
                    <img src="img/whatsapp.png" alt="WhatsApp">
                    <span>75 99108-7732</span>
                </div>
                <div class="item">
                    <img src="img/local.png" alt="Localização">
                    <span>R. Marechal Castelo Branco - 1758 Feira de Santana</span>
                </div>
                <div id="instagram" class="item">
                    <img src="img/instagram.png" alt="Instagram">
                    <span>Instagram</span>
                </div>
                <div class="item">
                    <img src="img/qr.png" alt="QR Code">
                    <span>SCAN ME</span>
                </div>
            </div>
        </div>
    </footer>

</body>

</html>
